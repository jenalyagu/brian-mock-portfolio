<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.09)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Metallic sheen -->
  <rect width="32" height="32" rx="6" fill="url(#sheen)"/>
  <!-- Border -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="5.5" fill="none"
        stroke="rgba(255,255,255,0.14)" stroke-width="1"/>

  <!-- BM monogram -->
  <text
    x="16" y="21"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="14"
    font-weight="800"
    letter-spacing="1"
    fill="white">BM</text>

  <!-- Teal accent line -->
  <line x1="8" y1="26.5" x2="24" y2="26.5"
        stroke="#00C8CE" stroke-width="1.5" stroke-linecap="round"/>
</svg>
